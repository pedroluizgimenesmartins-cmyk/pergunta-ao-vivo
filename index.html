<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pergunta ao Vivo</title><link rel="stylesheet" href="/app.css"></head>
<body>
<div class="teacher">
  <aside>
    <div class="logo">PERGUNTA <span>AO VIVO</span></div>
    <label>Pergunta</label>
    <textarea id="q">Qual palavra representa melhor uma boa liderança?</textarea>
    <button id="start">INICIAR / NOVA PERGUNTA</button>
    <div class="qr">
      <div class="qr-title">ESCANEIE PARA RESPONDER</div>
      <img id="qr"><div id="url"></div>
    </div>
    <div class="buttons"><button id="toggle">ENCERRAR RESPOSTAS</button><button id="reset" class="dark">LIMPAR</button></div>
    <div class="count"><b id="total">0</b><span> respostas</span></div>
  </aside>
  <main>
    <div class="top"><span>PERGUNTA</span><span id="status">● AO VIVO</span></div>
    <h1 id="question"></h1>
    <section id="cloud"></section>
    <div id="empty">As respostas dos alunos aparecerão aqui.</div>
  </main>
</div>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io();
function render(d){
 if(d.question) $("question").textContent=d.question;
 $("total").textContent=d.total;
 $("status").textContent=d.active?"● AO VIVO":"● ENCERRADA";
 $("toggle").textContent=d.active?"ENCERRAR RESPOSTAS":"REABRIR RESPOSTAS";
 $("cloud").innerHTML="";
 $("empty").style.display=d.words.length?"none":"block";
 const max=d.words[0]?.count||1;
 d.words.forEach((w,i)=>{
  const x=document.createElement("div"), size=32+(w.count/max)*78;
  x.className=i===0?"word winner":"word";x.style.fontSize=size+"px";
  x.innerHTML=esc(w.text)+" <small>"+w.count+"</small>";
  $("cloud").appendChild(x);
 });
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
socket.on("update",render);
$("start").onclick=async()=>fetch("/api/question",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:$("q").value})});
$("toggle").onclick=async()=>fetch("/api/toggle",{method:"POST"});
$("reset").onclick=async()=>fetch("/api/reset",{method:"POST"});
(async()=>{render(await fetch("/api/state").then(r=>r.json()));const x=await fetch("/api/qr?host="+encodeURIComponent(location.origin)).then(r=>r.json());$("qr").src=x.dataUrl;$("url").textContent=x.url})()
</script></body></html>
